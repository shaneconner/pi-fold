name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install measured Pi runtime
        run: |
          pi_version="$(node -p "require('./package-lock.json').packages['node_modules/@earendil-works/pi-coding-agent'].version")"
          npm install --global --prefix "$HOME/.npm-global" \
            "@earendil-works/pi-coding-agent@$pi_version" --ignore-scripts --no-audit --no-fund

      # The experiment now runs each arm inside a bubblewrap mount namespace, and
      # gate 73 drives the real thing rather than matching source: it builds the
      # argv, starts the sandbox and asks the process inside what it can see. That
      # needs bubblewrap and unprivileged user namespaces on the runner.
      - name: Install bubblewrap
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap
          # Ubuntu 24.04 ships AppArmor's restriction on unprivileged user
          # namespaces, which is what a runner rejects with "setting up uid map:
          # Permission denied". The workstation has it off already.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          bwrap --version
          bwrap --unshare-all --share-net --dev /dev --proc /proc --ro-bind /usr /usr \
            --symlink usr/lib /lib --symlink usr/lib /lib64 --symlink usr/bin /bin \
            -- /usr/bin/true && echo "unprivileged namespaces work"

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Verify experiment harness
        run: node scripts/verify_pi_context_experiment.mjs
