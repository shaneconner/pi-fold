<svg xmlns="http://www.w3.org/2000/svg" width="720" height="258" viewBox="0 0 720 258" role="img" aria-label="A completed unit becomes a pending mark that changes nothing. Marks accumulate for free until occupancy reaches maxTarget, when one commit applies all of them in a single rewrite.">
