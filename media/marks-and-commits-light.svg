<text x="2" y="14" font-size="11" font-weight="700" fill="#656d76" letter-spacing="0.08em" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">MARKS ACCUMULATE, ONE COMMIT APPLIES THEM</text>
<rect x="2" y="34" width="142" height="62" rx="7" fill="#ffffff" stroke="#d0d7de" stroke-width="1.4"/>
<text x="73.0" y="69.0" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">unit completes</text>
<line x1="144" y1="65" x2="206" y2="65" stroke="#8c959f" stroke-width="1.6" marker-end="url(#a-8c959f)"/>
<rect x="206" y="34" width="200" height="62" rx="7" fill="#ffffff" stroke="#d0d7de" stroke-width="1.4"/>
<text x="306.0" y="54.0" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">runtime marks the span</text>
<text x="306.0" y="69.0" font-size="11.0" font-weight="400" fill="#656d76" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">window unchanged</text>
<text x="306.0" y="84.0" font-size="11.0" font-weight="400" fill="#656d76" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">cached prefix intact</text>
<path d="M 306 96 C 306 124, 236 124, 236 100" fill="none" stroke="#8c959f" stroke-width="1.6" marker-end="url(#a-8c959f)"/>
<text x="271" y="140" font-size="11.5" fill="#656d76" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">below maxTarget: repeat, free</text>
