<rect x="276" y="222" width="210" height="34" rx="7" fill="#ffffff" stroke="#d0d7de" stroke-width="1.4"/>
<text x="381.0" y="243.0" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">expand: restored in place</text>
<text x="500" y="218" font-size="12.5" fill="#656d76" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">both verify the SHA-256</text>
