<text x="608.0" y="69.0" font-size="11.0" font-weight="400" fill="#656d76" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">every standing mark</text>
