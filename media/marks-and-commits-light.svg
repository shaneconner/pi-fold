<text x="102.0" y="228.0" font-size="12.5" font-weight="400" fill="#1f2328" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">brief in the window</text>
